<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoAxiii | Servicios informáticos y tecnológicos en Carmona</title>
    <meta name="description" content="Servicios tecnológicos e informáticos independientes en Carmona (Sevilla) y alrededores. Reparación de ordenadores, montaje, consolas, optimización de software y proyectos web sin intermediarios.">
    <meta name="keywords" content="informatica carmona, reparar ordenador carmona, servicio tecnico carmona, reparar portatil sevilla, montaje pc carmona, tecnoaxiii">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-beige: #f7f5f0;
            --surface-white: #ffffff;
            --text-dark: #1e2022;
            --text-muted: #5a5e63;
            --accent-orange: #d96b43;
            --accent-orange-hover: #c25934;
            --border-gray: #e4e2dd;
            --radius: 12px;
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-beige);
            color: var(--text-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: var(--surface-white);
            border-bottom: 1px solid var(--border-gray);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--accent-orange);
        }

        .tag-location {
            font-size: 0.85rem;
            background-color: var(--bg-beige);
            padding: 0.35rem 0.75rem;
            border-radius: 50px;
            font-weight: 500;
            border: 1px solid var(--border-gray);
            color: var(--text-muted);
        }

        .hero {
            max-width: 1100px;
            margin: 0 auto;
            padding: 4rem 1.5rem 3rem 1.5rem;
            text-align: center;
        }

        .hero-badge {
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.75rem;
            line-height: 1.15;
            letter-spacing: -0.02em;
            margin-bottom: 1.25rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-desc {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 620px;
            margin: 0 auto 2.5rem auto;
        }

        .cta-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius);
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            width: 100%;
        }

        @media (min-width: 576px) {
            .btn { width: auto; }
        }

        .btn-primary {
            background-color: var(--accent-orange);
            color: var(--surface-white);
        }

        .btn-primary:hover {
            background-color: var(--accent-orange-hover);
        }

        .btn-secondary {
            background-color: var(--surface-white);
            color: var(--text-dark);
            border: 1px solid var(--border-gray);
        }

        .btn-secondary:hover {
            background-color: var(--bg-beige);
        }

        .main-content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem 5rem 1.5rem;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--text-dark);
            padding-bottom: 0.5rem;
        }

        .grid-services {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .grid-services {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 992px) {
            .grid-services {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .card-service {
            background-color: var(--surface-white);
            border: 1px solid var(--border-gray);
            border-radius: var(--radius);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        .card-service:hover {
            border-color: var(--text-dark);
            transform: translateY(-2px);
        }

        .card-icon {
            font-size: 1.75rem;
            margin-bottom: 1.25rem;
            color: var(--accent-orange);
            background-color: var(--bg-beige);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .card-service h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        .card-service ul {
            list-style: none;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .card-service ul li {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            padding-left: 1.25rem;
            position: relative;
        }

        .card-service ul li::before {
            content: "•";
            color: var(--accent-orange);
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .price-container {
            margin-top: auto;
        }

        .price-toggle-btn {
            background: none;
            border: none;
            color: var(--text-dark);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-beige);
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .price-toggle-btn:hover {
            background-color: var(--border-gray);
        }

        .price-toggle-btn::after {
            content: "+";
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            transition: transform 0.2s ease;
        }

        .price-toggle-btn.active::after {
            content: "−";
        }

        .price-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            background-color: var(--surface-white);
        }

        .price-content-inner {
            padding: 1rem 0.5rem 0.5rem 0.5rem;
            border-top: 1px dashed var(--border-gray);
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            padding: 0.4rem 0;
            border-bottom: 1px solid #f1efe9;
        }

        .price-item:last-child {
            border-bottom: none;
        }

        .price-label {
            color: var(--text-dark);
            font-weight: 500;
            padding-right: 10px;
        }

        .price-value {
            color: var(--accent-orange);
            font-weight: 700;
            white-space: nowrap;
        }

        .disclaimer-box {
            background-color: var(--surface-white);
            border-left: 3px solid var(--accent-orange);
            border-top: 1px solid var(--border-gray);
            border-right: 1px solid var(--border-gray);
            border-bottom: 1px solid var(--border-gray);
            padding: 1.5rem;
            border-radius: var(--radius);
            margin-top: 4rem;
        }

        .disclaimer-box p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        footer {
            background-color: var(--surface-white);
            border-top: 1px solid var(--border-gray);
            padding: 3rem 1.5rem;
            text-align: center;
            margin-top: 4rem;
        }

        footer p {
            font-size: 0.95rem;
            color: var(--text-muted);
margin-bottom: 1rem;
}
.footer-brand {
font-family: 'Space Grotesk', sans-serif;
font-weight: 700;
color: var(--text-dark);
margin-bottom: 0.5rem;
}
@media (max-width: 576px) {
h1 { font-size: 2rem; }
.hero { padding: 3rem 1rem 1.5rem 1rem; }
.main-content { padding: 1rem 1rem 3rem 1rem; }
.card-service { padding: 1.5rem; }
}
